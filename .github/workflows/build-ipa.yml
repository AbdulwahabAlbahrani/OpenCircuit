name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pin Liveline to 0.3.1
        working-directory: ios
        run: |
          sed -i '' 's/from: "0.3.1"/exactVersion: "0.3.1"/' project.yml

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build Unsigned App
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenCircuit.xcodeproj \
            -scheme OpenCircuit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build.log | grep -E "error:|BUILD FAILED|BUILD SUCCEEDED" || (grep -B 2 -A 5 "error:" build.log | tail -n 60 && exit 1)

      - name: Package Unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/OpenCircuit.app Payload/
          zip -r OpenCircuit.ipa Payload/

      - name: Upload OpenCircuit.ipa
        uses: actions/upload-artifact@v4
        with:
          name: OpenCircuit-ipa
          path: ios/OpenCircuit.ipa
